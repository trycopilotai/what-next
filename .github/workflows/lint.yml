name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      # Both checkouts land in siblings rather than nesting, so
      # the linter's own Markdown is never part of the tree
      # being linted.
      #
      # Pinned to commit SHAs. Tags are mutable and this
      # workflow runs on pull requests from forks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repo

      # Exact peeled commit of lint v0.1.7. The dependency
      # record binds the tag resolution; a mutable tag is not
      # used as an execution pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: trycopilotai/lint
          ref: 7856512a84d96ff796cc10975e219b5b2a0836f3
          path: lint

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # Read-only: the job reports drift, it does not rewrite
      # the tree and push a fixup.
      - name: Check Markdown formatting
        run: |
          python3 lint/lint.py \
            --cwd repo \
            --language markdown \
            --read-only
