name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite needs python3 and git and nothing else, so
        # it runs on more than one python.
        python-version: ["3.11", "3.13"]
    steps:
      # Pinned to commit SHAs. Tags are mutable and this
      # workflow runs on pull requests from forks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # No install step on purpose. If this job ever needs one,
      # the suite's own docstring claim, "Runs offline with no
      # third-party packages", has stopped being true.
      - name: Run the offline packaging contract
        run: make check
